# Sonde 01 : carte de test (ancienne esp32-ds18b20-1), emplacement rdc.
substitutions:
  name: sonde-01
  site: banes
  place: rdc
  board: esp32-c3-devkitm-1              # C3 SuperMini. Pour un ESP32-C6 : esp32-c6-devkitc-1
  onewire_pin: GPIO4                     # C3 SuperMini. Sur C6, GPIO4 est à ma connaissance une broche de strapping : choisir une broche libre (à confirmer avec la fiche de la carte)
  mqtt_broker: 192.168.20.2              # broker de la maison à Banes (sans authentification)

packages:
  base: !include sonde-base.yaml
